<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal YouTube Viewer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="app">

    <header>
        <h1>Personal YouTube Viewer</h1>

        <p>
            Private local video library
        </p>
    </header>


    <section class="download-box">

        <label for="videoId">
            YouTube Video ID or URL
        </label>

        <input
            id="videoId"
            placeholder="Video ID or YouTube URL"
            autocomplete="off"
            spellcheck="false"
        >


        <label for="filename">
            Local filename
        </label>

        <input
            id="filename"
            placeholder="Leave blank to use the video title"
            autocomplete="off"
            spellcheck="false"
        >


        <button
            id="downloadButton"
            type="button"
        >
            Download &amp; Play
        </button>


        <div
            id="videoInfoPanel"
            class="video-info-panel"
            hidden
        ></div>


        <div
            id="status"
            aria-live="polite"
        >
            Ready
        </div>

    </section>


    <section class="player-section">

        <video
            id="player"
            controls
            preload="metadata"
        ></video>

        <div id="placeholder">
            No video selected
        </div>

    </section>


    <section class="library-section">

        <div class="library-header">

            <div>
                <h2>Library</h2>

                <p class="library-description">
                    Downloaded videos stored locally
                </p>
            </div>

            <button
                id="refreshButton"
                class="small-button"
                type="button"
            >
                Refresh
            </button>

        </div>


        <div id="library">
            Loading library...
        </div>

    </section>

</main>


<script src="script.js?v=4"></script>

</body>

</html>

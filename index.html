<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal YouTube Viewer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<main class="app">

    <header>

        <h1>Personal YouTube Viewer</h1>

        <p>
            Private local video library
        </p>

    </header>


    <section class="download-box">

        <label for="videoId">
            YouTube Video ID
        </label>

        <input
            id="videoId"
            maxlength="11"
            placeholder="Enter video ID"
            autocomplete="off"
        >


        <label for="filename">
            Local filename
        </label>

        <input
            id="filename"
            placeholder="My Video.mp4"
            autocomplete="off"
        >


        <button
            id="downloadButton"
        >
            Download & Play
        </button>


        <div id="status">
            Ready
        </div>

    </section>


    <section class="player-section">

        <video
            id="player"
            controls
            preload="metadata"
        ></video>


        <div id="placeholder">
            No video selected
        </div>

    </section>


    <section class="library-section">

        <div class="library-header">

            <h2>Library</h2>

            <button
                id="refreshButton"
                class="small-button"
            >
                Refresh
            </button>

        </div>


        <div id="library">
            Loading library...
        </div>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
